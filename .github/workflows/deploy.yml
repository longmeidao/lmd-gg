name: Deploy to Cloudflare Workers

# 撰写面板发文章 = Worker 往仓库提交一次 commit，然后要靠这里重新构建部署。
# 迁到 Cloudflare 之前这一步是 Netlify 自动做的，换过来之后一度没人接手，
# 结果是 GitHub 收到了提交但站点不更新。
on:
  push:
    branches: [main]
    # 只排除跟站点产物无关的。**不能**写 `**/*.md` —— 文章就是 md，
    # 那样一排除，发文章反而不会触发部署，等于白做。
    # （paths-ignore 也不支持 `!` 取反。）
    paths-ignore:
      - docs/**
      - README*.md
      - CLAUDE.md
  workflow_dispatch:

permissions:
  contents: read

# 构建机器的时区决定「编辑于」显示成哪一天。runner 默认是 UTC，而 pubDate 是
# 写作时的本地日期，两者一错位就会出现「发布 8月1日 · 编辑于 7月31日」——
# 同一时刻被渲染成两个日期。钉死成写作所在时区。
env:
  TZ: Asia/Shanghai

# 连着发几条时，只部署最新那次；但别打断进行中的部署
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # remark-modified-time 要读每个文件的提交历史来算「最后修改」，
          # 浅克隆会让它取不到，日期就全变成最近一次构建的时间。
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 格式、Worker 单测、浏览器冒烟、类型、Astro 检查和完整构建全部通过才部署。
      - name: Verify and build
        run: pnpm verify

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

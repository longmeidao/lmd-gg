overrides:
  '@babel/core@<=7.29.0': '>=7.29.6'
  '@babel/helpers@<7.26.10': '>=7.26.10'
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0'
  # 旧依赖请求 1.x，但当前覆盖本来就已使用 5.x；钉到修复 DoS 的补丁版。
  brace-expansion@<1.1.13: '5.0.9'
  fast-uri@<=3.1.1: '>=3.1.2'
  flatted@<=3.4.1: '>=3.4.2'
  immutable@>=5.0.0 <5.1.5: '>=5.1.5'
  js-yaml@>=4.0.0 <=4.1.1: '>=4.2.0'
  katex@>=0.12.0 <=0.16.20: '>=0.16.21'
  mdast-util-to-hast@>=13.0.0 <13.2.1: '>=13.2.1'
  minimatch@<3.1.4: '>=3.1.4'
  # 安全覆盖把 minimatch 抬到了 10.x，但 jsx-a11y 用的是 v3 的 CJS 默认导出，
  # 会在任何含 <label> 的 .astro 文件上抛 "(0 , _minimatch.default) is not a function"。
  # 单独把它钉在已修复 ReDoS 的 3.x 上；typescript-eslint 仍然用 10.x。
  eslint-plugin-jsx-a11y>minimatch: '>=3.1.4 <4'
  nanoid@>=4.0.0 <5.0.9: '>=5.0.9'
  picomatch@<2.3.2: '>=2.3.2'
  postcss@<8.5.10: '>=8.5.10'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
